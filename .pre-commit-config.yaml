minimum_pre_commit_version: "4.0.0"
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
        stages: [pre-commit]
      - id: check-yaml
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: ./scripts/run_repo_python.sh -m ruff check
        language: system
        files: ^(src|tests|scripts)/.*\.py$
        stages: [pre-commit]

      - id: source-tests
        name: source-aware test suite
        entry: ./scripts/run_repo_python.sh -m pytest -q
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: generated-docs
        name: generated documentation is synchronized
        entry: ./scripts/run_repo_python.sh scripts/render_agentic_harness_docs.py --check
        language: system
        pass_filenames: false
        files: ^(docs/.*\.md|scripts/render_(agentic_harness_docs|markdown_html)\.py)$
        stages: [pre-commit]

      - id: check-precommit-cache
        name: require a fresh pre-commit state
        entry: ./scripts/run_repo_python.sh scripts/precommit_cache.py check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
