name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        # pull_request's github.sha is the synthetic merge commit; validate against main.
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and development dependencies
        run: python -m pip install -e ".[test]" -r requirements-dev.txt
      - name: Validate pre-commit configuration
        run: python -m pre_commit validate-config
      - name: Lint source, tests, and scripts
        run: python -m ruff check src tests scripts
      - name: Run full deterministic tests (includes NAO public seams)
        run: python -m pytest
      - name: Run recorded NAO adapter canary
        run: python -m ab_harness_nao > "$RUNNER_TEMP/source-canary.json"
      - name: Check generated documentation
        run: python scripts/render_agentic_harness_docs.py --check
      - name: Build wheel and verify isolated imports
        run: |
          mkdir -p "$RUNNER_TEMP/wheelhouse"
          python -m pip wheel . --no-deps --wheel-dir "$RUNNER_TEMP/wheelhouse"
          wheel_path="$(printf '%s\n' "$RUNNER_TEMP"/wheelhouse/*.whl)"
          test -f "$wheel_path"
          smoke_venv="$RUNNER_TEMP/package-smoke"
          python -m venv "$smoke_venv"
          "$smoke_venv/bin/python" -m pip install "$wheel_path"
          cd "$RUNNER_TEMP"
          "$smoke_venv/bin/python" -I -c 'from pathlib import Path; import sys; import ab_harness; import ab_harness_nao; prefix = Path(sys.prefix).resolve(); assert Path(ab_harness.__file__).resolve().is_relative_to(prefix); assert Path(ab_harness_nao.__file__).resolve().is_relative_to(prefix)'
          "$smoke_venv/bin/python" -I -m ab_harness_nao > "$RUNNER_TEMP/installed-canary.json"
          "$smoke_venv/bin/python" -I - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"])
          source = json.loads((root / "source-canary.json").read_text())
          installed = json.loads((root / "installed-canary.json").read_text())
          assert source == installed, "installed wheel and source disagree on recorded behavior"
          assert installed["status"] == "passed"
          assert installed["accepted_case"]["passed"] is True
          assert installed["rejected_case"]["failure_stage"] == "semantic_admission"
          assert installed["counterexample_case"]["acceptance_status"] == "rejected"
          assert installed["verified_trace_digest"].startswith("verified-trace-digest:sha256:")
          PY
